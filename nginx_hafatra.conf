# ============================================================
# HAFATRA - Configuration Nginx
# Fichier: /etc/nginx/sites-available/hafatra
# ============================================================
# Remplacez : votre-domaine.com et /var/www/hafatra

server {
    listen 80;
    server_name votre-domaine.com www.votre-domaine.com;

    # Rediriger tout HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name votre-domaine.com www.votre-domaine.com;

    root /var/www/hafatra;
    index index.php;

    # ── Certificat SSL (Let's Encrypt) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/votre-domaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Sécurité SSL ────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── En-têtes de sécurité ────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # CRITIQUE pour caméra/micro WebRTC
    add_header Permissions-Policy "camera=*, microphone=*, display-capture=(self)" always;

    # ── Types MIME audio/vidéo ───────────────────────────────
    types {
        audio/webm      webm;
        audio/ogg       ogg;
        audio/mpeg      mp3;
        video/mp4       mp4;
        image/svg+xml   svg;
    }

    # ── PHP via PHP-FPM ─────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_param  HTTPS on;
        fastcgi_read_timeout 60;
    }

    # ── Fichiers statiques avec cache ───────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webm|ogg|mp3|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Uploads : accès audio/images ────────────────────────
    location /uploads/ {
        # Bloquer l'exécution PHP dans uploads
        location ~ \.php$ { deny all; }
        # Autoriser les fichiers media
        try_files $uri =404;
        add_header Accept-Ranges bytes;
    }

    # ── Bloquer fichiers sensibles ───────────────────────────
    location ~ ^/(config\.php|debug.*\.php|\.env|\.htaccess) {
        deny all;
    }

    # ── Logs ────────────────────────────────────────────────
    access_log /var/log/nginx/hafatra_access.log;
    error_log  /var/log/nginx/hafatra_error.log;

    # ── Taille upload ────────────────────────────────────────
    client_max_body_size 50M;
}
